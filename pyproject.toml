[project]
name = "coding-agent"
version = "0.1.0"
description = "A terminal coding agent built on Claude's bash and text editor tools"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cagent = "coding_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coding_agent"]
